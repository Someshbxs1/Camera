<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Camera</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #error {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            background: black;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>

    <video id="camera" autoplay muted playsinline></video>

    <div id="error"></div>

    <script>
        const video = document.getElementById("camera");
        const error = document.getElementById("error");

        async function startCamera() {
            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {

                showError(
                    "Camera API is unavailable. Open this page using HTTPS."
                );
                return;
            }

            try {
                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    });

                video.srcObject = stream;

            } catch (err) {
                console.error(err);

                showError(
                    "Camera access failed.<br><br>" +
                    "Make sure Chrome has permission to use the camera " +
                    "and that this page is opened over HTTPS."
                );
            }
        }

        function showError(message) {
            error.innerHTML = message;
            error.style.display = "flex";
        }

        startCamera();
    </script>

</body>
</html>
